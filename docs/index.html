<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScholarPal</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#282d38;
    --fg:#e8ebf0; --dim:#9aa3b2; --dim2:#6b7484;
    --accent:#4c8dff; --accent2:#7c5cff; --ok:#2ecc71; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;letter-spacing:.3px}
  header .meta{color:var(--dim2);font-size:12px}
  header .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;max-width:1500px;margin:0 auto;align-items:start}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.5px}
  .hot-item{padding:10px 0;border-top:1px dashed var(--line)}
  .hot-item:first-of-type{border-top:0;padding-top:0}
  .hot-title{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:flex-start}
  .hot-rank{color:var(--accent);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .hot-sum{color:var(--dim);font-size:12.5px;margin-top:3px}
  .kw{display:inline-block;font-size:11px;color:var(--dim2);border:1px solid var(--line);
    border-radius:6px;padding:0 6px;margin:4px 4px 0 0}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);cursor:pointer;font-size:13px}
  .tab.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .item.rec{border-color:#3a4a6b;box-shadow:0 0 0 1px rgba(76,141,255,.15) inset}
  .item .row1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .item .title{font-size:15px;font-weight:600;line-height:1.45}
  .badge{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .badge.hot{color:var(--warn);border-color:#4a3a1a;background:#241d10}
  .badge.news{color:var(--ok);border-color:#1e3f2a;background:#101f16}
  .item .sum{color:#c7cedb;font-size:13.5px;margin:8px 0 0}
  .item .who{color:var(--dim2);font-size:12px;margin-top:8px}
  .tags{margin-top:8px}
  .tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:0 7px;margin:0 5px 5px 0}
  .tag.hit{color:var(--accent);border-color:#2c4b7d;background:#101a2b}
  .acts{display:flex;gap:14px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    color:var(--dim);font-size:13px}
  .act{cursor:pointer;user-select:none;display:flex;gap:5px;align-items:center}
  .act:hover{color:var(--fg)}
  .act.on{color:var(--accent)}
  .act.dis{color:#c0563f}
  .note{margin-top:8px}
  .note textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:8px;font:inherit;resize:vertical;min-height:52px}
  .note .saved{color:var(--dim2);font-size:12px}
  .muted{color:var(--dim2);font-size:12.5px}
  .intlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:11.5px;border:1px solid #2c4b7d;background:#101a2b;color:var(--accent);
    border-radius:20px;padding:1px 9px}
  .syncbar{padding:8px 20px;background:#1a1408;border-bottom:1px solid #4a3a1a;color:#e8c88a;font-size:13px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .syncbar.ok{background:#0f1a12;border-color:#1e3f2a;color:#8fd6a8}
  .syncbar input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6px 9px;font:inherit;min-width:320px;flex:1}
  .onb{background:var(--panel);border:1px solid #2c4b7d;border-radius:12px;padding:14px;margin-bottom:14px}
  .onb .onbrow{display:flex;gap:10px;align-items:center;justify-content:space-between;
    padding:9px 0;border-top:1px dashed var(--line)}
  .onb .onbrow:first-of-type{border-top:0}
  .onb .t{font-size:13.5px}
  .onb .bs{display:flex;gap:7px;flex:0 0 auto}
  .onb .bs button{border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    padding:4px 10px;cursor:pointer;font-size:12.5px}
  .onb .bs button.y{border-color:#2c6b45;color:#8fd6a8}
  .onb .bs button.n{border-color:#6b3232;color:#e0958a}
  .empty{color:var(--dim2);padding:20px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>ScholarPal</h1>
  <span class="meta" id="gen">加载中…</span>
  <span class="spacer"></span>
  <button class="btn ghost" id="btnRefresh">刷新</button>
  <button class="btn" id="btnSync">连接记忆</button>
</header>
<div id="syncbar" class="syncbar" style="display:none"></div>
<div class="wrap">
  <aside>
    <div class="card" id="interestCard" style="margin-bottom:14px">
      <h2>我的兴趣（长期记忆）</h2>
      <div id="interests" class="muted">还没有记录。点赞或评论后会自动学习。</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <h2>学术界热搜</h2>
      <div id="hotA" class="empty">加载中…</div>
    </div>
    <div class="card">
      <h2>工业界热搜</h2>
      <div id="hotI" class="empty">加载中…</div>
    </div>
  </aside>
  <main>
    <div id="onboard"></div>
    <div class="tabs" id="tabs"></div>
    <div id="feed" class="empty">加载中…</div>
  </main>
</div>
<script>
const MEM_REPO = "Ovenxx/ScholarPal-memory";
const MEM_FILE = "profile.json";
const API = "https://api.github.com";
const LS_MEM = "sp_memory_v1", LS_TOK = "sp_token_v1";

let FEED = null;
let MEM = loadMem();
let TAB = null;

/* ---------- memory ---------- */
function loadMem(){
  try{ const m = JSON.parse(localStorage.getItem(LS_MEM)||"null"); if(m && m.version) return m; }catch(e){}
  return {version:1, onboarded:false, interests:{}, items:{}, updated:null};
}
function saveMem(){
  MEM.updated = new Date().toISOString();
  localStorage.setItem(LS_MEM, JSON.stringify(MEM));
  renderInterests();
  schedulePush();
}
function token(){ return localStorage.getItem(LS_TOK)||""; }

/* ---------- interests ---------- */
function recomputeInterests(){
  const w = {};
  for(const id in MEM.items){
    const it = MEM.items[id]; const tags = it.tags||[];
    let d = 0;
    if(it.like === 1) d = 1;
    else if(it.like === -1) d = -1;
    if(it.comment) d += 0.6;               // commenting signals real interest
    if(!d) continue;
    for(const t of tags){ if(!t) continue; w[t] = (w[t]||0) + d; }
  }
  MEM.interests = w;
}
function topInterests(n){
  return Object.entries(MEM.interests).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,n);
}
function interestMatch(item){
  const tags = item.tags||[]; if(!tags.length) return 0;
  const top = topInterests(8); if(!top.length) return 0;
  const max = top[0][1] || 1;
  let s = 0;
  for(const t of tags) if(MEM.interests[t] > 0) s += MEM.interests[t]/max;
  return Math.min(1, s/tags.length);
}
function score(item){
  const imp = (item.importance||0)/10;
  const per = interestMatch(item);
  const learned = topInterests(8).length > 0;
  return learned ? 0.55*imp + 0.45*per : imp;
}

/* ---------- rendering ---------- */
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

function renderInterests(){
  const box = document.getElementById("interests");
  const top = topInterests(12);
  box.innerHTML = "";
  if(!top.length){ box.className="muted"; box.textContent="还没有记录。点赞或评论后会自动学习。"; return; }
  box.className = "";
  const p = el("div","muted","由你的点赞与评论自动学习得出，用于把相关研究排到前面：");
  box.appendChild(p);
  const wrap = el("div","intlist");
  top.forEach(([t,v])=>{ const c=el("span","chip", t+" "+(v>0?"+":"")+ (Math.round(v*10)/10)); wrap.appendChild(c); });
  box.appendChild(wrap);
}

function renderHot(){
  const paint = (node, arr, kind) => {
    node.innerHTML = "";
    if(!arr || !arr.length){ node.className="empty"; node.textContent = "今天暂无（需要 AI 密钥才有总结）"; return; }
    node.className = "";
    arr.forEach((h,i)=>{
      const d = el("div","hot-item");
      const t = el("div","hot-title");
      t.appendChild(el("span","hot-rank", String(i+1)+"."));
      t.appendChild(el("span",null,h.title||""));
      d.appendChild(t);
      if(h.summary) d.appendChild(el("div","hot-sum", h.summary));
      (h.keywords||[]).forEach(k=>d.appendChild(el("span","kw",k)));
      node.appendChild(d);
    });
  };
  paint(document.getElementById("hotA"), FEED.hot && FEED.hot.academic);
  paint(document.getElementById("hotI"), FEED.hot && FEED.hot.industry);
}

function itemCard(it){
  const c = el("div","item");
  const learned = topInterests(8).length>0;
  if(learned && interestMatch(it) > 0.34) c.classList.add("rec");

  const r1 = el("div","row1");
  r1.appendChild(el("span","title", it.title));
  if(it.kind === "news") r1.appendChild(el("span","badge news","资讯"));
  if((it.importance||0) >= 7) r1.appendChild(el("span","badge hot","重要 "+Math.round(it.importance)));
  c.appendChild(r1);

  if(it.summary) c.appendChild(el("div","sum", it.summary));

  const tags = el("div","tags");
  (it.tags||[]).forEach(t=>{
    const hit = MEM.interests[t] > 0;
    tags.appendChild(el("span","tag"+(hit?" hit":""), t));
  });
  c.appendChild(tags);

  const who = [];
  if(it.authors) who.push(it.authors);
  if(it.date) who.push(it.date);
  if(it.source) who.push(it.source);
  if(it.topic) who.push(it.topic);
  c.appendChild(el("div","who", who.join(" · ")));

  const rec = MEM.items[it.id] || {};
  const acts = el("div","acts");

  const like = el("span","act"+(rec.like===1?" on":""), "👍 感兴趣");
  like.onclick = ()=>{ setLike(it, rec.like===1?0:1); };
  acts.appendChild(like);

  const dis = el("span","act"+(rec.like===-1?" dis":""), "👎 不感兴趣");
  dis.onclick = ()=>{ setLike(it, rec.like===-1?0:-1); };
  acts.appendChild(dis);

  const cm = el("span","act"+(rec.comment?" on":""), "💬 评论");
  cm.onclick = ()=>{ const n=c.querySelector(".note"); n.style.display = n.style.display==="none"?"block":"none"; };
  acts.appendChild(cm);

  if(it.url){ const a=el("a","act","↗ 原文"); a.href=it.url; a.target="_blank"; a.rel="noopener"; acts.appendChild(a); }
  c.appendChild(acts);

  const note = el("div","note"); note.style.display = rec.comment ? "block" : "none";
  const ta = el("textarea"); ta.value = rec.comment||""; ta.placeholder="写点你的想法（只有你自己能看到）…";
  let timer=null;
  ta.oninput = ()=>{ clearTimeout(timer); timer=setTimeout(()=>{ setComment(it, ta.value); }, 900); };
  const saved = el("div","saved","");
  note.appendChild(ta); note.appendChild(saved);
  c.appendChild(note);
  return c;
}

function setLike(it, v){
  const rec = MEM.items[it.id] || (MEM.items[it.id] = {tags: it.tags||[]});
  rec.tags = it.tags||[]; rec.like = v; rec.ts = new Date().toISOString();
  recomputeInterests(); saveMem(); renderFeed();
}
function setComment(it, text){
  const rec = MEM.items[it.id] || (MEM.items[it.id] = {tags: it.tags||[], like:0});
  rec.tags = it.tags||[]; rec.comment = text; rec.ts = new Date().toISOString();
  recomputeInterests(); saveMem();
}

function renderFeed(){
  const box = document.getElementById("feed");
  box.className = ""; box.innerHTML = "";
  const mod = FEED.modules.find(m=>m.id===TAB) || FEED.modules[0];
  if(!mod){ box.className="empty"; box.textContent="没有数据"; return; }
  const items = mod.items.slice().sort((a,b)=>score(b)-score(a));
  if(!items.length){ box.className="empty"; box.textContent="这个板块今天没有内容"; return; }
  items.forEach(it=>box.appendChild(itemCard(it)));
}

function renderTabs(){
  const box = document.getElementById("tabs"); box.innerHTML="";
  FEED.modules.forEach(m=>{
    const t = el("div","tab"+(m.id===TAB?" on":""), m.label + " (" + m.items.length + ")");
    t.onclick = ()=>{ TAB=m.id; renderTabs(); renderFeed(); };
    box.appendChild(t);
  });
}

/* ---------- onboarding (Q1 option c) ---------- */
function renderOnboard(){
  const box = document.getElementById("onboard"); box.innerHTML="";
  if(MEM.onboarded) return;
  const pool = [];
  FEED.modules.forEach(m=>m.items.slice(0,8).forEach(it=>pool.push(it)));
  if(!pool.length) return;
  const card = el("div","onb");
  card.appendChild(el("div",null,"👋 第一次来：勾几条你感兴趣的，我立刻就能学会你的口味（随时可跳过）"));
  card.appendChild(el("div","muted","只需十几秒，之后推荐会明显变准。"));
  pool.slice(0,16).forEach(it=>{
    const row = el("div","onbrow");
    row.appendChild(el("div","t", it.title.length>70?it.title.slice(0,70)+"…":it.title));
    const bs = el("div","bs");
    const y = el("button","y","感兴趣"); const n = el("button","n","跳过");
    y.onclick = ()=>{ setLike(it,1); initOnboardPool(pool); };
    n.onclick = ()=>{ setLike(it,-1); initOnboardPool(pool); };
    bs.appendChild(y); bs.appendChild(n); row.appendChild(bs);
    card.appendChild(row);
  });
  const done = el("button","btn primary","完成，开始看"); done.style.marginTop="12px";
  done.onclick = ()=>{ MEM.onboarded = true; saveMem(); renderOnboard(); renderFeed(); };
  card.appendChild(done);
  box.appendChild(card);
}
function initOnboardPool(){ renderOnboard(); }

/* ---------- GitHub sync (route B) ---------- */
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,"")))); }

async function ghGet(){
  const r = await fetch(`${API}/repos/${MEM_REPO}/contents/${MEM_FILE}`,{
    headers:{Authorization:"token "+token(), Accept:"application/vnd.github+json"}, cache:"no-store"});
  if(!r.ok) throw new Error("读取失败 "+r.status);
  const j = await r.json();
  return {sha:j.sha, data:JSON.parse(b64decode(j.content))};
}
async function ghPut(data, sha){
  const r = await fetch(`${API}/repos/${MEM_REPO}/contents/${MEM_FILE}`,{
    method:"PUT",
    headers:{Authorization:"token "+token(), Accept:"application/vnd.github+json","Content-Type":"application/json"},
    body: JSON.stringify({message:"memory: update", content:b64encode(JSON.stringify(data,null,1)), sha})});
  if(!r.ok) throw new Error("写入失败 "+r.status);
  return (await r.json()).content.sha;
}

let pushTimer=null, lastSha=null;
function schedulePush(){ if(!token()) return; clearTimeout(pushTimer); pushTimer=setTimeout(push, 1500); }
async function push(){
  if(!token()) return;
  try{
    const cur = await ghGet();
    const merged = mergeMem(cur.data, MEM);
    lastSha = await ghPut(merged, cur.sha);
    setBar("ok","已同步到记忆库 · " + new Date().toLocaleTimeString());
  }catch(e){ setBar("","同步失败：" + e.message); }
}
function mergeMem(a, b){
  const out = {version:1, onboarded: !!(a.onboarded||b.onboarded), interests:{}, items:{}, updated:new Date().toISOString()};
  for(const id in (a.items||{})) out.items[id]=a.items[id];
  for(const id in (b.items||{})){
    const x=a.items&&a.items[id], y=b.items[id];
    if(!x){ out.items[id]=y; continue; }
    const xt=x.ts||"", yt=y.ts||"";
    out.items[id] = (yt>=xt) ? y : x;
  }
  return out;
}
async function pull(){
  if(!token()) return false;
  try{
    const cur = await ghGet();
    MEM = mergeMem(cur.data, MEM); lastSha = cur.sha;
    recomputeInterests(); localStorage.setItem(LS_MEM, JSON.stringify(MEM));
    renderInterests(); setBar("ok","已载入记忆库 · " + (cur.data.updated||""));
    return true;
  }catch(e){ setBar("","载入失败：" + e.message); return false; }
}
function setBar(kind, msg){
  const b = document.getElementById("syncbar");
  b.style.display="flex"; b.className = "syncbar" + (kind==="ok"?" ok":"");
  b.innerHTML=""; b.appendChild(el("span",null,msg));
  if(kind!=="ok"){
    const i=document.createElement("input"); i.placeholder="粘贴访问令牌（只保存在本机浏览器）"; i.value=token();
    const s=el("button","btn primary","保存并连接");
    s.onclick=()=>{ localStorage.setItem(LS_TOK, i.value.trim()); setBar("","已保存，正在连接…"); (async()=>{ if(await pull()){ renderFeed(); renderInterests(); renderOnboard(); } })(); };
    const c=el("button","btn ghost","稍后"); c.onclick=()=>b.style.display="none";
    b.appendChild(i); b.appendChild(s); b.appendChild(c);
  }
}

/* ---------- boot ---------- */
async function boot(){
  try{
    const r = await fetch("feed.json?t="+Date.now(), {cache:"no-store"});
    FEED = await r.json();
  }catch(e){
    document.getElementById("feed").textContent = "feed.json 读取失败：" + e.message; return;
  }
  document.getElementById("gen").textContent =
    "更新于 " + (FEED.generated_at||"?").replace("T"," ").replace("Z"," UTC") + " · 模型 " + (FEED.model||"?");
  TAB = FEED.modules[0] && FEED.modules[0].id;
  recomputeInterests();
  renderInterests(); renderHot(); renderTabs(); renderFeed(); renderOnboard();

  if(token()){ if(await pull()){ renderFeed(); renderInterests(); renderOnboard(); } }
  else setBar("","记忆尚未连接：点赞与评论目前只存在本机。连接后可跨设备同步。");
}
document.getElementById("btnRefresh").onclick = ()=>location.reload();
document.getElementById("btnSync").onclick = ()=>setBar("","粘贴访问令牌以连接记忆库（只保存在本机浏览器）");
boot();
</script>
</body>
</html>
