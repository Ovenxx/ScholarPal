name: ScholarPal - Module A (LLM4OR/L2O) daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Asia/Shanghai

# Shared with module B: serialises the two digests so their pushes cannot race.
concurrency:
  group: scholarpal-digest
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Upstream engine is PINNED. Do not track main: an upstream change would
  # silently alter our output. Bump UPSTREAM_SHA deliberately.
  UPSTREAM_REPO: https://github.com/Vincentqyw/cv-arxiv-daily.git
  UPSTREAM_SHA: 2c6fa8569db604f448adb82124a2e352c78da6b0

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # arxiv 1.x is unusable: it queries http:// and its User-Agent is now
      # rejected by arXiv (301 then 406). Use the maintained 2.x line.
      - name: Install dependencies
        run: pip install "arxiv>=2,<3" requests pyyaml

      # The engine is fetched at run time and never committed to this repo.
      - name: Fetch pinned upstream engine
        run: |
          git init -q .engine
          git -C .engine remote add origin "$UPSTREAM_REPO"
          git -C .engine fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C .engine checkout -q FETCH_HEAD

      # arxiv 2.x removed Search.results(); the engine still calls it. One-line
      # compatibility shim on our throwaway clone (never committed). The grep
      # fails the step loudly if the shim did not apply.
      - name: Shim engine for arxiv 2.x
        run: |
          sed -i 's/search_engine\.results()/arxiv.Client().results(search_engine)/' .engine/daily_arxiv.py
          grep -n "arxiv.Client().results(search_engine)" .engine/daily_arxiv.py

      - name: Render module A digest
        run: python .engine/daily_arxiv.py --config_path config/llm4or.yml

      - name: Commit digest
        run: |
          git config user.name  "ScholarPal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/llm4or
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(llm4or): daily digest"
            git pull --rebase --autostash origin main
            git push
          fi