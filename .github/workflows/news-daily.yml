name: ScholarPal - Module C (News + Site build) daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"   # 06:30 Asia/Shanghai, after modules A (22:00) and B (22:20)

# Shared with modules A/B so their pushes cannot race.
concurrency:
  group: scholarpal-digest
  cancel-in-progress: false

permissions:
  contents: write

env:
  TREND_REPO: https://github.com/sansan0/TrendRadar.git
  TREND_SHA: 792bcc3928b1617bba09df34989fd5675c159b86

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      # Upstream engine is fetched at run time and never committed here.
      - name: Fetch pinned TrendRadar
        run: |
          git init -q .news
          git -C .news remote add origin "$TREND_REPO"
          git -C .news fetch -q --depth 1 origin "$TREND_SHA"
          git -C .news checkout -q FETCH_HEAD

      # Upstream ships a previously generated index.html. Remove every existing
      # HTML so anything found after the run was produced by THIS run.
      - name: Clear stale upstream artefacts
        run: |
          find .news -name '*.html' -not -path '*/.git/*' -delete
          rm -rf .news/output
          echo "cleared"

      - name: Overlay our config
        run: |
          cp news/config/config.yaml .news/config/config.yaml
          cp news/config/frequency_words.txt .news/config/frequency_words.txt

      - name: Run TrendRadar
        env:
          GITHUB_ACTIONS: "true"
        run: |
          cd .news
          uv sync --frozen --no-dev
          set +e
          uv run python -m trendradar > /tmp/tr.log 2>&1
          echo "trendradar exit code: $?"
          set -e
          echo "=== artefacts ==="
          ls -la output 2>/dev/null | head -20
          find . -name '*.db' -not -path './.git/*' -not -path './.venv/*' -printf '%s\t%p\n'

      # TrendRadar keeps its own page; the app owns docs/index.html.
      - name: Publish TrendRadar report
        run: |
          SRC=$(find .news -name '*.html' -not -path '*/.git/*' -not -path '*/.venv/*' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2)
          if [ -z "$SRC" ]; then echo "ERROR: TrendRadar produced no HTML report"; exit 1; fi
          echo "publishing $SRC -> docs/news.html"
          cp "$SRC" docs/news.html

      # Coarse -> fine: keyword-filtered candidates from modules A/B plus the news
      # rows TrendRadar just collected, scored and summarised in a few LLM calls.
      - name: Build feed for the web app
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TOP_N: "18"
          NEWS_MAX: "40"
        run: |
          set +e
          python tools/build_feed.py
          rc=$?
          set -e
          echo "build_feed exit code: $rc"
          ls -la docs/feed.json || true
          if [ $rc -ne 0 ]; then echo "ERROR: feed build failed"; exit 1; fi

      - name: Commit
        run: |
          git config user.name  "ScholarPal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.html docs/feed.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(news): daily report + feed"
            git pull --rebase --autostash origin main
            git push
          fi
