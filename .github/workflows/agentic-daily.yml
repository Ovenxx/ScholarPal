name: ScholarPal - Module B (Agentic AI) daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Asia/Shanghai

permissions:
  contents: write

env:
  # Upstream engine is PINNED. Do not track main: an upstream change would
  # silently alter our output. Bump UPSTREAM_SHA deliberately.
  UPSTREAM_REPO: https://github.com/Vincentqyw/cv-arxiv-daily.git
  UPSTREAM_SHA: 2c6fa8569db604f448adb82124a2e352c78da6b0

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # arxiv is pinned to 1.x because the engine calls Search.results(),
      # which arxiv 2.x removed.
      - name: Install dependencies
        run: pip install "arxiv==1.4.8" requests pyyaml

      # arxiv 1.x still queries http://export.arxiv.org, which arXiv now
      # 301-redirects. We patch the INSTALLED LIBRARY to https and leave the
      # upstream engine code untouched. The assert makes a silent no-op fail loudly.
      - name: Patch arxiv endpoint to https
        run: |
          python - <<'PY'
          import pathlib, arxiv
          p = pathlib.Path(arxiv.__file__)
          s = p.read_text()
          n = s.count("http://export.arxiv.org/api/query")
          assert n > 0, "PATCH FAILED: pattern not found in " + str(p)
          p.write_text(s.replace("http://export.arxiv.org/api/query",
                                 "https://export.arxiv.org/api/query"))
          print("patched", n, "occurrence(s) in", p)
          PY

      # The engine is fetched at run time and never committed to this repo.
      - name: Fetch pinned upstream engine
        run: |
          git init -q .engine
          git -C .engine remote add origin "$UPSTREAM_REPO"
          git -C .engine fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C .engine checkout -q FETCH_HEAD

      - name: Render module B digest
        run: python .engine/daily_arxiv.py --config_path config/agentic.yml

      - name: Commit digest
        run: |
          git config user.name  "ScholarPal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agentic
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(agentic): daily digest"
            git push
          fi
